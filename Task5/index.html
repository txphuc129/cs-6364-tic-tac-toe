<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three-Machine Tic-Tac-Toe</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <header>
      <h1 id="head">3x3 Three-Machine Tic-Tac-Toe</h1>
    </header>

    <section id="controls" aria-label="Game controls">
      <form id="game-form">
        <label for="board-size">Board size B (3-10):</label>
        <input
          id="board-size"
          name="board-size"
          type="number"
          min="3"
          max="10"
          step="1"
          value="3"
          required
        />
        <label for="game-count">Number of games N (1-10):</label>
        <input
          id="game-count"
          name="game-count"
          type="number"
          min="1"
          max="10"
          step="1"
          value="1"
          required
        />
        <button id="run-games" type="submit">Run games</button>
      </form>
      <p id="status" role="status" aria-live="polite">
        Choose a board size and number of games, then select Run games.
      </p>
    </section>

    <section id="game">
      <div id="tic" role="group" aria-label="B by B Tic-Tac-Toe board"></div>

      <div id="rules" aria-label="Game results">
        <h2>Results</h2>
        <table>
          <thead>
            <tr>
              <th>Machine</th>
              <th>Wins</th>
              <th>Losses</th>
              <th>Draws</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">X</th>
              <td><output id="x-wins">0</output></td>
              <td><output id="x-losses">0</output></td>
              <td><output id="x-draws">0</output></td>
            </tr>
            <tr>
              <th scope="row">O</th>
              <td><output id="o-wins">0</output></td>
              <td><output id="o-losses">0</output></td>
              <td><output id="o-draws">0</output></td>
            </tr>
            <tr>
              <th scope="row">I</th>
              <td><output id="i-wins">0</output></td>
              <td><output id="i-losses">0</output></td>
              <td><output id="i-draws">0</output></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
